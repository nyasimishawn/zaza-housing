plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.zaza'
version = '0.0.1-SNAPSHOT'

// Optional local output directory for projects stored in cloud-synced folders.
def localBuildDirectory = providers.environmentVariable('ZAZA_BUILD_DIR')
if (localBuildDirectory.isPresent()) {
	layout.buildDirectory.set(file(localBuildDirectory.get()))
} else if (projectDir.absolutePath.toLowerCase().contains('onedrive')) {
	def projectKey = Integer.toHexString(projectDir.absolutePath.hashCode())
	layout.buildDirectory.set(new File(gradle.gradleUserHomeDir, "zaza-build/${rootProject.name}-${projectKey}"))
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(24)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.54.0'
	implementation 'org.apache.pdfbox:pdfbox:3.0.8'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	testImplementation('org.springframework.boot:spring-boot-starter-test') {
		exclude group: 'org.mockito'
	}
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// Release embedded servers, HTTP clients, and cached Spring contexts between classes.
	forkEvery = 1
}
