spring:
  datasource:
    url: ${ZAZA_TEST_DB_URL:${ZAZA_DB_URL:jdbc:postgresql://127.0.0.1:5432/zaza}}
    username: ${ZAZA_TEST_DB_USER:${ZAZA_DB_USER:admin}}
    password: ${ZAZA_TEST_DB_PASSWORD:${ZAZA_DB_PASSWORD:}}
    hikari:
      schema: zaza_foundation_test
      # Cached test application contexts must not exhaust local PostgreSQL slots.
      maximum-pool-size: 4
      minimum-idle: 1
  flyway:
    default-schema: zaza_foundation_test
    schemas: zaza_foundation_test
zaza:
  media:
    jobs:
      enabled: false
  security:
    # Legacy domain tests exercise their own authorization. New security tests explicitly enable the production MFA gate.
    require-admin-mfa: false
    mail-mode: 'off'
  auth:
    requests-per-minute: 10000
